name: CI

# Run on every push to main and on every pull request.
on:
  push:
    branches: [main]
  pull_request:

# The workflow only needs to read the code.
permissions:
  contents: read

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: pytest -v

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t rl-agents-api .

      - name: Start the container and call /health
        run: |
          docker run -d --name api -p 8000:8000 rl-agents-api
          curl --fail --retry 10 --retry-delay 1 --retry-all-errors http://127.0.0.1:8000/health

      - name: Show container logs
        if: always()
        run: docker logs api
